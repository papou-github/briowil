name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  python-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python
        run: python -m compileall -q custom_components
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("custom_components").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          json.loads(Path("hacs.json").read_text(encoding="utf-8"))
          print("JSON syntax OK")
          PY
      - name: Basic protocol tests
        run: python -m unittest discover -s tests -v
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
